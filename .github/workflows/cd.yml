name: CD

on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Wait for CI
    uses: ./.github/workflows/ci.yml

  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push hive-metastore
        uses: docker/build-push-action@v6
        with:
          context: ./hive
          file: ./hive/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/datalakehouse-hive-metastore:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/datalakehouse-hive-metastore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build & push fastapi
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/datalakehouse-fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/datalakehouse-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
