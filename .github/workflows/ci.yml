name: CI

on:
  push:
    branches: [master, anhehe]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check api/ airflow/dags/ spark/app/

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

  check-dag-import:
    name: Airflow DAG Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow
        run: |
          pip install "apache-airflow==2.9.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.0/constraints-no-providers-3.11.txt"

      - name: Check DAG imports
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:///${{ runner.temp }}/airflow/airflow.db"
        run: |
          mkdir -p "$AIRFLOW_HOME"
          airflow db migrate --quiet
          python - <<'PYEOF'
          import sys
          from airflow.models import DagBag

          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"IMPORT ERROR in {path}:\n{err}\n")
              sys.exit(1)
          print(f"All {len(bag.dags)} DAGs imported successfully.")
          PYEOF

  check-spark-syntax:
    name: Spark Job Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Spark jobs
        run: |
          exit_code=0
          for f in spark/app/*.py; do
            echo "Checking $f ..."
            python -m py_compile "$f" || exit_code=1
          done
          exit $exit_code

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build hive-metastore image
        uses: docker/build-push-action@v6
        with:
          context: ./hive
          file: ./hive/Dockerfile
          push: false
          tags: hive-metastore-s3:4.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build fastapi image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: datalakehouse-fastapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
