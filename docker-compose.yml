services:
# ---------- PostgreSQL ----------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    # volumes:
    #   - ./postgres_data:/var/lib/postgresql/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-init:
    image: postgres:15
    container_name: postgres-init
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    command: >
      bash -c "
      psql -h postgres -U ${POSTGRES_USER} -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c \"CREATE DATABASE airflow;\";
      psql -h postgres -U ${POSTGRES_USER} -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='metabase'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c \"CREATE DATABASE metabase;\"
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network
    restart: "no"

# ---------- Kafka ----------
  kafka:
    image: public.ecr.aws/bitnami/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092      
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server=kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - data-network
    restart: unless-stopped

# ---------- Kafka UI ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8084:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kraft-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - KAFKA_CLUSTERS_0_READONLY=false
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=debezium-connect
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://connect:8083
    depends_on:
      - kafka
      - connect
    networks:
      - data-network
    restart: unless-stopped

# -----------Connect----------
  connect:
    image: debezium/connect:2.7.0.Final
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_status
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - KEY_CONVERTER_SCHEMAS_ENABLE=false
      - ENABLE_DEBEZIUM_SCRIPTING=false
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./connectors:/kafka/connectors
      # - ./connect_data:/kafka/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

# ---------- MinIO ----------
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    # volumes:
    #   - ./minio_data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ---------- MinIO Init (Create Buckets) ----------
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    volumes:
      - ./:/data
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/bronze --ignore-existing;
      mc mb local/silver --ignore-existing;
      mc mb local/gold --ignore-existing;
      echo 'Buckets created: bronze, silver, gold';
      exit 0
      "
    networks:
      - data-network
    depends_on:
      minio:
        condition: service_healthy

# ---------- Hive Metastore ----------
  hive-metastore:
    build:
      context: ./hive
      dockerfile: Dockerfile
    image: hive-metastore-s3:4.0.0
    container_name: hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - HIVE_DB_NAME=${POSTGRES_DB}
      - HIVE_DB_HOST=postgres
      - HIVE_DB_PORT=5432
      - HIVE_DB_USER=${POSTGRES_USER}
      - HIVE_DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  
# ---------- Spark ----------
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master"
    env_file:
      - .env
    environment:
      - SPARK_MODE=master
      - HOME=/opt/spark/work-dir
      - SPARK_SUBMIT_OPTS=-Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      - KAFKA_BROKER=${KAFKA_BOOTSTRAP_SERVERS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=${S3_ENDPOINT}
      - HIVE_METASTORE_URI=${HIVE_METASTORE_URI}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark/app:/opt/spark/app
    depends_on:
      - minio
      - hive-metastore
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    env_file:
      - .env
    environment:
      - SPARK_MODE=worker
      - HOME=/opt/spark/work-dir
      - SPARK_SUBMIT_OPTS=-Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_BROKER=${KAFKA_BOOTSTRAP_SERVERS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=${S3_ENDPOINT}
      - HIVE_METASTORE_URI=${HIVE_METASTORE_URI}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    depends_on:
      - spark-master
    networks:
      - data-network
    volumes:
      - ./spark/app:/opt/spark/app
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    restart: unless-stopped

